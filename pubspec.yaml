name: ledger_mobile_app
description: >-
  A minimal, offline-first udhaar (credit) ledger app built with Flutter.
  Local-only SQLite storage. Supports English (LTR) and Urdu (RTL).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Local-only SQLite storage.
  sqflite: ^2.3.3
  # Cross-platform path joining for the database file location.
  path: ^1.9.0
  # Persist the selected app language between launches.
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
