name: Backend tests
on:
  push:
    paths: ['backend/**', 'admin-android/app/src/main/java/com/ahsantraders/admin/data/AdminApi.kt', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'admin-android/app/src/main/java/com/ahsantraders/admin/data/AdminApi.kt', '.github/workflows/backend.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ahsan_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d ahsan_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/ahsan_test
      JWT_SECRET: ci-only-secret-not-for-production-at-least-32-chars
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: docker build -t ahsan-api .
