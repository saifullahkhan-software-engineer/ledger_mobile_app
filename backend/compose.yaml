services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ahsan
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: ahsan
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahsan -d ahsan"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ahsan:localdev@db:5432/ahsan
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
