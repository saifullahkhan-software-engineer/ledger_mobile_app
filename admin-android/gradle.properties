org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# --- Backend URL (baked into the APK at build time) ------------------------
# The app's backend address comes from the build, NOT from the login screen.
# Priority:
#   1. APP_SERVER_URL environment variable   (export APP_SERVER_URL=https://…)
#   2. appServerUrl below (or -PappServerUrl=… on the command line)
#   3. http://10.0.2.2:8000 (Android emulator loopback to the host PC)
# Example:
#   appServerUrl=https://your-production-server.com
appServerUrl=http://192.168.1.30:8000

# --- Baked-in icons (fetchAppIcons task, see app/build.gradle.kts) ---------
# On EVERY build, the icons saved in the backend database (uploaded via the
# app's "Screen icons" screen) are downloaded and embedded into the APK under
# assets/saved_icons/, so the app uses them directly — even offline.
# appIconServer defaults to the backend URL above; set it only to override.
# Credentials are only needed to also bake the per-business icons.
appIconServer=
appIconPhone=
appIconPassword=
