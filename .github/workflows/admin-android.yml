name: Admin Android APK
on:
  push:
    paths: ['admin-android/**', '.github/workflows/admin-android.yml']
  pull_request:
    paths: ['admin-android/**', '.github/workflows/admin-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ahsan-admin-debug
          path: admin-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-test-and-lint-reports
          path: |
            admin-android/app/build/reports/tests/
            admin-android/app/build/reports/lint-results-debug.html
